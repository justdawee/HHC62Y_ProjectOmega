services:
  smartpantry:
    build:
      context: ./SmartPantry
      dockerfile: Dockerfile
    image: ghcr.io/justdawee/hhc62y_projectomega:latest
    container_name: smartpantry
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      DB_PATH: /data/smartpantry.db
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
